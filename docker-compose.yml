services:
  postgres:
    image: postgres:16-alpine
    container_name: acac-postgres
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    networks:
      - acac-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: acac-backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - acac-net

  worker:
    build:
      context: ./backend
    container_name: acac-worker
    restart: unless-stopped
    command: ["python", "-m", "worker.runner"]
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - acac-net

volumes:
  postgres_data:
  uploads_data:

networks:
  acac-net:
    driver: bridge
